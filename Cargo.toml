[package]
name = "hanko"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "A small self-hosted passkey-first OIDC identity provider"

[dependencies]
axum = { version = "0.8.4", features = ["json", "query", "form"] }
base64 = "0.22"
chacha20poly1305 = "0.10.1"
dotenvy = "0.15"
jsonwebtoken = { version = "9.3.1", features = ["use_pem"] }
p256 = { version = "0.14.0", features = ["pem", "pkcs8"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros", "uuid", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["limit", "trace", "set-header", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
webauthn-rs = { version = "=0.5.5", features = ["conditional-ui", "danger-allow-state-serialisation", "danger-credential-internals"] }
subtle = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
